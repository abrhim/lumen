name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version comes from packageManager in package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Gate: the full workspace harness must be green before anything ships.
      - run: pnpm exec turbo test typecheck
      - run: node --test scripts/__tests__/backfill-collections.test.mjs

      - name: Build
        run: pnpm --filter @lumen/web build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: "710460c1d8026d7b12b2859f77da8404"
          workingDirectory: apps/web
          command: deploy
